services:
  api:
    build: .
    container_name: api
    ports:
      - "8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      SERVER_ADDRESS: ${SERVER_ADDRESS:-:8080}
      CONTEXT_TIMEOUT: ${CONTEXT_TIMEOUT:-2}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-test}
      DB_PASS: ${DB_PASS:-test}
      DB_NAME: ${DB_NAME:-test}
      ACCESS_TOKEN_EXPIRY_HOUR: ${ACCESS_TOKEN_EXPIRY_HOUR:-2}
      REFRESH_TOKEN_EXPIRY_HOUR: ${REFRESH_TOKEN_EXPIRY_HOUR:-168}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-access_token_secret}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-refresh_token_secret}
      INTERNAL_SECRET_KEY: ${INTERNAL_SECRET_KEY:-internal_secret_key}
      INTERNAL_CRYPTO_URL: ${INTERNAL_CRYPTO_URL:-http://crypto:8080}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: postgres-db
    ports:
      - 5433:5432
    restart: always
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test -d test" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./tmp/db-data:/var/lib/postgresql/data
