      confirmed_at:
        type: string
      created_at:
        type: string
      eligible_at:
        type: string
      id:
        type: string
      minimum_confirmers_snapshot:
        type: integer
      requested_at:
        type: string
      status:
        $ref: '#/definitions/domain.UserTransitionCaseStatus'
      updated_at:
        type: string
      user_id:
        type: string
      waiting_period_days_snapshot:
        type: integer
      waiting_started_at:
        type: string
    type: object
  domain.UserTransitionCaseStatus:
    enum:
    - pending_confirmation
    - waiting_period
    - confirmed
    - cancelled
    type: string
    x-enum-varnames:
    - UserTransitionCaseStatusPending
