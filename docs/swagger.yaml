      updated_at:
        type: string
      user_id:
        type: string
      waiting_period_days:
        type: integer
    type: object
  handler.UpdateLegacyRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
host: localhost:8080
info:
  contact: {}
  description: DIEALOG 디지털 유산 관리 서비스 백엔드 API
  title: DIEALOG Backend API
  version: "1.0"
paths:
  /last-word/protected:
    get:
      description: 현재 사용자가 생성한 유언 메시지 목록을 조회합니다.
      produces:
      - application/json
      responses:
        "200":
          description: 유언 메시지 목록 조회 성공
          schema:
            items:
              $ref: '#/definitions/domain.LastWord'
            type: array
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 유언 메시지 목록 조회
      tags:
      - LastWord
    post:
      consumes:
      - application/json
      description: 새로운 유언 메시지를 생성하고 수신자 및 수신자 그룹을 지정합니다.
      parameters:
      - description: 생성할 유언 메시지 정보
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.CreateLastWordRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 유언 메시지 생성 성공
          schema:
            $ref: '#/definitions/domain.LastWord'
        "400":
          description: 잘못된 요청 파라미터
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 유언 메시지 생성
      tags:
      - LastWord
  /last-word/protected/{id}:
    delete:
      description: 특정 유언 메시지를 삭제합니다.
      parameters:
      - description: 유언 메시지 ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 유언 메시지 삭제 성공
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "400":
          description: 잘못된 ID 형식
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: 유언 메시지를 찾을 수 없음
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 유언 메시지 삭제
      tags:
      - LastWord
    get:
      description: ID에 해당하는 유언 메시지의 상세 정보를 조회합니다.
      parameters:
      - description: 유언 메시지 ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 유언 메시지 조회 성공
          schema:
            $ref: '#/definitions/domain.LastWord'
        "400":
          description: 잘못된 ID 형식
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: 유언 메시지를 찾을 수 없음
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 유언 메시지 상세 조회
      tags:
      - LastWord
    put:
      consumes:
      - application/json
      description: 특정 유언 메시지의 제목, 내용, 수신자 및 수신자 그룹을 수정합니다.
      parameters:
      - description: 유언 메시지 ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: 수정할 유언 메시지 정보
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateLastWordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 유언 메시지 수정 성공
          schema:
            $ref: '#/definitions/domain.LastWord'
        "400":
          description: 잘못된 요청 파라미터 또는 ID 형식
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: 유언 메시지를 찾을 수 없음
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 유언 메시지 수정
      tags:
      - LastWord
  /legacy/protected:
    get:
      description: 현재 사용자의 레거시 목록을 조회합니다.
      produces:
      - application/json
      responses:
        "200":
          description: 레거시 목록 조회 성공
          schema:
            items:
              $ref: '#/definitions/domain.LegacyResponse'
            type: array
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 레거시 목록 조회
      tags:
      - Legacy
    post:
      consumes:
      - application/json
      description: 새로운 레거시(디지털 유산 그룹) 항목을 생성합니다.
      parameters:
      - description: 생성할 레거시 정보
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.Legacy'
      produces:
      - application/json
      responses:
        "201":
          description: 레거시 생성 성공
          schema:
            $ref: '#/definitions/domain.LegacyResponse'
        "400":
          description: 잘못된 요청 파라미터
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 레거시 생성
      tags:
      - Legacy
  /legacy/protected/{id}:
    delete:
      description: 특정 레거시 및 연관된 데이터를 삭제합니다.
      parameters:
      - description: 레거시 ID (UUID)
        in: path
