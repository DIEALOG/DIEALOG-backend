        type: string
      updated_at:
        type: string
    type: object
  domain.AccountHandlingTaskAssignee:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      request_token_expires_at:
        type: string
      requested_at:
        type: string
      responded_at:
        type: string
      response_message:
        type: string
      stakeholder_id:
        type: string
      status:
        $ref: '#/definitions/domain.AccountHandlingTaskAssigneeStatus'
