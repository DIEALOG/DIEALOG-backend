      auth_token_expires_at:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      invite_expires_at:
        type: string
      invited_at:
        type: string
      name:
        type: string
      phone:
        type: string
      revoked_at:
        type: string
      stakeholder_id:
        type: string
      status:
        $ref: '#/definitions/domain.UserTransitionConfirmerStatus'
      updated_at:
