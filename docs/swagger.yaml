    type: object
  domain.SignupRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone_number:
        type: string
    required:
    - email
    - name
    - password
    - phone_number
    type: object
  domain.Stakeholder:
    properties:
      created_at:
        type: string
      email:
        type: string
      group_ids:
        items:
          type: string
        type: array
      groups:
        items:
          $ref: '#/definitions/domain.StakeholderGroup'
        type: array
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      relationship:
        type: string
      stakeholder_id:
        type: string
      user_id:
        type: string
    required:
    - name
    type: object
  domain.StakeholderGroup:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      stakeholder_ids:
        items:
          type: string
        type: array
      stakeholders:
        items:
          $ref: '#/definitions/domain.Stakeholder'
        type: array
      user_id:
        type: string
    required:
    - name
    type: object
  domain.SubmitAccountHandlingResultRequest:
    properties:
      message:
        type: string
      success:
        type: boolean
      token:
        type: string
    type: object
  domain.SubmitTransitionConfirmationRequest:
    properties:
      comment:
        type: string
      decision:
        $ref: '#/definitions/domain.UserTransitionDecision'
    type: object
  domain.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  domain.TransitionInvitationResponse:
    properties:
      confirmer:
        $ref: '#/definitions/domain.UserTransitionConfirmer'
      expires_at:
        type: string
      invitation_token:
        type: string
    type: object
  domain.TransitionInvitationTokenRequest:
    properties:
      token:
        type: string
    type: object
  domain.UpdateLastWordRequest:
    properties:
      message:
        type: string
      receiver_group_ids:
        items:
          type: string
        type: array
      receiver_ids:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  domain.UpdateUserTransitionPolicyRequest:
    properties:
      alive_check_interval_days:
        type: integer
      minimum_confirmers:
        type: integer
      waiting_period_days:
        type: integer
    type: object
  domain.UserAliveCheck:
    properties:
      created_at:
        type: string
      due_at:
        type: string
      id:
        type: string
      responded_at:
        type: string
      scheduled_at:
        type: string
      sequence:
        type: integer
      status:
        $ref: '#/definitions/domain.UserAliveCheckStatus'
      user_id:
        type: string
    type: object
  domain.UserAliveCheckStatus:
    enum:
    - scheduled
    - pending
    - responded
    - overdue
    - cancelled
    type: string
    x-enum-varnames:
    - UserAliveCheckStatusScheduled
    - UserAliveCheckStatusPending
    - UserAliveCheckStatusResponded
    - UserAliveCheckStatusOverdue
    - UserAliveCheckStatusCancelled
  domain.UserConfig:
    properties:
      certification_before_sensitive_information:
        type: boolean
