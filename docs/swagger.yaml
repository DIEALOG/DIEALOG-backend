  /transition/protected/policy:
    get:
      description: 현재 사용자의 사후 전환 정책을 조회합니다. 정책이 없으면 기본 정책을 생성합니다.
      produces:
      - application/json
      responses:
        "200":
          description: 정책 조회 성공
          schema:
            $ref: '#/definitions/domain.UserTransitionPolicy'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 사후 전환 정책 조회
      tags:
      - Transition
    patch:
      consumes:
      - application/json
      description: 동의자 최소 수, 대기 기간, 생존 확인 주기를 수정합니다.
      parameters:
      - description: 수정할 정책
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateUserTransitionPolicyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 정책 수정 성공
          schema:
            $ref: '#/definitions/domain.UserTransitionPolicy'
        "400":
          description: 잘못된 요청 또는 정책 값
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 사후 전환 정책 수정
      tags:
      - Transition
  /transition/protected/tasks/{id}/request:
    post:
      description: 계정에 지정된 관계자에게 전달할 사후 처리 작업 요청 토큰을 발급합니다. 요청할 때마다 계정의 현재 관계자를 추가로
        반영하고 기존 관계자는 유지합니다. 요청 토큰은 이 응답에서만 반환됩니다.
      parameters:
      - description: 계정 처리 작업 ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 계정 처리 요청 토큰 발급 결과
          schema:
            $ref: '#/definitions/domain.AccountHandlingRequestResponse'
        "400":
          description: 요청할 수 없는 상태, 관계자 없음 또는 잘못된 ID
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: 작업을 찾을 수 없음
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 계정 처리 요청 토큰 발급
      tags:
      - Transition
  /transition/stakeholder-tasks/result:
    post:
      consumes:
      - application/json
      description: 관계자가 계정 처리 요청 토큰으로 실제 처리 성공 또는 실패 여부를 보고합니다.
      parameters:
      - description: 처리 결과와 요청 토큰
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.SubmitAccountHandlingResultRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 계정 처리 결과 보고 성공
          schema:
            $ref: '#/definitions/domain.AccountHandlingTask'
        "400":
          description: 잘못된 요청, 만료된 토큰 또는 처리할 수 없는 상태
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: 계정 처리 성공 여부 보고
      tags:
      - Transition
securityDefinitions:
  BearerAuth:
    description: Enter your JWT token with the `Bearer ` prefix.
    in: header
    name: Authorization
    type: apiKey
  ConfirmerAuth:
    description: Enter the confirmer token returned when an invitation is accepted.
    in: header
    name: X-Confirmer-Token
    type: apiKey
swagger: "2.0"
