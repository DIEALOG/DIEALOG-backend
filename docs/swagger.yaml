        type: string
      updated_at:
        type: string
    type: object
  domain.AccountHandlingTaskAssigneeStatus:
    enum:
    - pending
    - confirmed
    - failed
    - cancelled
    type: string
    x-enum-varnames:
    - AccountHandlingTaskAssigneeStatusPending
    - AccountHandlingTaskAssigneeStatusConfirmed
    - AccountHandlingTaskAssigneeStatusFailed
    - AccountHandlingTaskAssigneeStatusCancelled
  domain.AccountHandlingTaskStatus:
    enum:
    - pending
    - in_progress
    - completed
    - failed
    - skipped
    type: string
    x-enum-varnames:
    - AccountHandlingTaskStatusPending
    - AccountHandlingTaskStatusInProgress
    - AccountHandlingTaskStatusCompleted
    - AccountHandlingTaskStatusFailed
    - AccountHandlingTaskStatusSkipped
  domain.AccountListResponse:
    properties:
