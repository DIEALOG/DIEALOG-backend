        type: array
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      user_id:
        type: string
    required:
    - name
    type: object
  domain.LegacyResponse:
    properties:
      accounts:
        items:
          $ref: '#/definitions/domain.AccountListResponse'
        type: array
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      user_id:
        type: string
    type: object
  domain.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  domain.Profile:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone_number:
        type: string
      profile_image_path:
        type: string
      stakeholder_groups:
        items:
          $ref: '#/definitions/domain.StakeholderGroup'
        type: array
      stakeholders:
        items:
          $ref: '#/definitions/domain.Stakeholder'
        type: array
    type: object
  domain.RefreshTokenRequest:
    properties:
