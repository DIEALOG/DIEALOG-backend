basePath: /api
definitions:
  domain.Account:
    properties:
      account_id:
        type: string
      account_password:
        type: string
      action:
        $ref: '#/definitions/domain.AccountAction'
      created_at:
        type: string
      data_location:
        type: string
      id:
        type: string
      legacy_id:
        type: string
      stakeholder_ids:
        items:
          type: string
        type: array
      stakeholders:
        items:
          $ref: '#/definitions/domain.Stakeholder'
        type: array
      type:
        $ref: '#/definitions/domain.AccountType'
    type: object
  domain.AccountAction:
    properties:
      action:
        $ref: '#/definitions/domain.AccountActionField'
      id:
        type: string
      message:
        type: string
    type: object
  domain.AccountActionField:
    enum:
    - delete
    - remain
    - permission-move
    - backup-and-delete
    - other
    type: string
    x-enum-varnames:
    - AccountActionDelete
    - AccountActionRemain
    - AccountActionPermissionMove
    - AccountActionBackupAndDelete
    - AccountActionOther
  domain.AccountType:
    properties:
      id:
        type: string
      name:
        type: string
      type:
        $ref: '#/definitions/domain.AccountTypeField'
    type: object
  domain.AccountTypeField:
    enum:
    - Google
    - Facebook
    - Twitter
    - Apple
    - Discord
    - Microsoft
    - KakaoTalk
    - GitHub
    - Telegram
    - Instagram
    - Other
    type: string
    x-enum-varnames:
    - AccountTypeGoogle
    - AccountTypeFacebook
    - AccountTypeTwitter
    - AccountTypeApple
    - AccountTypeDiscord
    - AccountTypeMicrosoft
    - AccountTypeKakaoTalk
    - AccountTypeGitHub
    - AccountTypeTelegram
    - AccountTypeInstagram
    - AccountTypeOther
  domain.AuthResponse:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
    type: object
  domain.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  domain.Legacy:
    properties:
      accounts:
        items:
          $ref: '#/definitions/domain.Account'
        type: array
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      user_id:
        type: string
    required:
    - name
    type: object
  domain.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  domain.Profile:
    properties:
      email:
        type: string
      name:
        type: string
      stakeholders:
        items:
          $ref: '#/definitions/domain.Stakeholder'
        type: array
      testament:
        type: string
    type: object
  domain.RefreshTokenRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  domain.SignupRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    required:
    - email
    - name
    - password
    type: object
  domain.Stakeholder:
    properties:
      created_at:
        type: string
      email:
        type: string
      group_ids:
        items:
          type: string
        type: array
      groups:
        items:
          $ref: '#/definitions/domain.StakeholderGroup'
        type: array
      id:
        type: string
      message:
        type: string
      name:
        type: string
      phone:
        type: string
      relationship:
        type: string
      user_id:
        type: string
    required:
    - name
    type: object
  domain.StakeholderGroup:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      stakeholder_ids:
        items:
          type: string
        type: array
      stakeholders:
        items:
          $ref: '#/definitions/domain.Stakeholder'
        type: array
      user_id:
        type: string
    required:
    - name
    type: object
  domain.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  domain.UpdateTestamentRequest:
    properties:
      testament:
        type: string
    required:
    - testament
    type: object
  handler.PaginatedLegacyResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Legacy'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  handler.UpdateLegacyRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
host: localhost:8080
info:
  contact: {}
  description: DIEALOG 디지털 유산 관리 서비스 백엔드 API
  title: DIEALOG Backend API
  version: "1.0"
paths:
  /legacy/protected:
    get:
      description: 현재 사용자의 레거시 목록을 페이징하여 조회합니다.
      parameters:
      - description: 페이지 번호
        in: query
        name: page
        type: integer
      - description: 페이지당 개수
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 레거시 목록 조회 성공
          schema:
            $ref: '#/definitions/handler.PaginatedLegacyResponse'
        "400":
          description: 페이지네이션 파라미터 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 레거시 목록 조회 (페이지네이션)
      tags:
      - Legacy
    post:
      consumes:
      - application/json
      description: 새로운 레거시(디지털 유산 그룹) 항목을 생성합니다.
      parameters:
      - description: 생성할 레거시 정보
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.Legacy'
      produces:
      - application/json
      responses:
        "201":
          description: 레거시 생성 성공
          schema:
            $ref: '#/definitions/domain.Legacy'
        "400":
          description: 잘못된 요청 파라미터
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 레거시 생성
      tags:
      - Legacy
  /legacy/protected/{id}:
    delete:
      description: 특정 레거시 및 연관된 데이터를 삭제합니다.
      parameters:
      - description: 레거시 ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 레거시 삭제 성공
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "400":
          description: 잘못된 ID 형식
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 레거시 삭제
      tags:
      - Legacy
    get:
      description: ID에 해당하는 레거시의 상세 정보 및 하위 계정 목록을 조회합니다.
      parameters:
      - description: 레거시 ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 레거시 상세 조회 성공
          schema:
            $ref: '#/definitions/domain.Legacy'
        "400":
          description: 잘못된 ID 형식
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: 레거시를 찾을 수 없음
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 레거시 상세 조회
      tags:
      - Legacy
    put:
      consumes:
      - application/json
      description: 특정 레거시의 이름을 수정합니다.
      parameters:
      - description: 레거시 ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: 수정할 레거시 정보
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateLegacyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 레거시 수정 성공
          schema:
            $ref: '#/definitions/domain.Legacy'
        "400":
          description: 잘못된 요청 파라미터 또는 ID 형식
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: 레거시를 찾을 수 없음
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 레거시 정보 수정
      tags:
      - Legacy
  /legacy/protected/{id}/account:
    post:
      consumes:
      - application/json
      description: 특정 레거시에 디지털 서비스 계정 정보 및 사후 처리 방침을 등록합니다.
      parameters:
      - description: 레거시 ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: 등록할 계정 정보
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.Account'
      produces:
      - application/json
      responses:
        "201":
          description: 계정 등록 성공
          schema:
            $ref: '#/definitions/domain.Account'
        "400":
          description: 잘못된 요청 파라미터 또는 ID 형식
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 레거시 하위 계정 등록
      tags:
      - Legacy
  /legacy/protected/{id}/account/{accountId}:
    delete:
      description: 특정 레거시에 등록된 디지털 서비스 계정을 삭제합니다.
      parameters:
      - description: 레거시 ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: 계정 ID (UUID)
        in: path
        name: accountId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 계정 삭제 성공
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "400":
          description: 잘못된 ID 형식
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 레거시 하위 계정 삭제
      tags:
      - Legacy
  /login:
    post:
      consumes:
      - application/json
      description: 이메일과 비밀번호로 로그인하여 액세스 및 리프레시 토큰을 발급합니다.
      parameters:
      - description: 로그인 정보
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 로그인 성공
          schema:
            $ref: '#/definitions/domain.AuthResponse'
        "400":
          description: 잘못된 요청 파라미터
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 이메일 또는 비밀번호 불일치
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: 로그인
      tags:
      - Auth
  /profile/protected:
    get:
      description: 현재 로그인된 사용자의 기본 프로필 및 등록된 이해관계자 정보를 조회합니다.
      produces:
      - application/json
      responses:
        "200":
          description: 프로필 조회 성공
          schema:
            $ref: '#/definitions/domain.Profile'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 내 프로필 조회
      tags:
      - Profile
  /profile/protected/testament:
    put:
      consumes:
      - application/json
      description: 사용자의 유언장(Testament) 내용을 등록 또는 수정합니다.
      parameters:
      - description: 수정할 유언장 내용
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateTestamentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 유언장 수정 성공
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "400":
          description: 잘못된 요청 파라미터
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 유언장 내용 수정
      tags:
      - Profile
  /refresh:
    post:
      consumes:
      - application/json
      description: 리프레시 토큰으로 새로운 액세스 및 리프레시 토큰을 재발급합니다.
      parameters:
      - description: 리프레시 토큰 정보
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 토큰 재발급 성공
          schema:
            $ref: '#/definitions/domain.AuthResponse'
        "400":
          description: 잘못된 요청 파라미터
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 유효하지 않은 리프레시 토큰
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: 토큰 갱신
      tags:
      - Auth
  /signup:
    post:
      consumes:
      - application/json
      description: 새로운 사용자 계정을 생성하고 액세스 및 리프레시 토큰을 발급합니다.
      parameters:
      - description: 회원가입 정보
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.SignupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 회원가입 성공
          schema:
            $ref: '#/definitions/domain.AuthResponse'
        "400":
          description: 잘못된 요청 파라미터
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: 회원가입
      tags:
      - Auth
  /stakeholder/protected:
    get:
      description: 현재 사용자가 등록한 모든 관계자(이해관계자) 목록을 조회합니다.
      produces:
      - application/json
      responses:
        "200":
          description: 관계자 목록 조회 성공
          schema:
            items:
              $ref: '#/definitions/domain.Stakeholder'
            type: array
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 관계자 목록 조회
      tags:
      - Stakeholder
    post:
      consumes:
      - application/json
      description: 사후 디지털 유산 전달 또는 연락 대상이 될 관계자(이해관계자) 정보를 등록합니다.
      parameters:
      - description: 등록할 관계자 정보
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.Stakeholder'
      produces:
      - application/json
      responses:
        "201":
          description: 관계자 등록 성공
          schema:
            $ref: '#/definitions/domain.Stakeholder'
        "400":
          description: 잘못된 요청 파라미터
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 관계자 등록
      tags:
      - Stakeholder
  /stakeholder/protected/{id}:
    delete:
      description: 특정 관계자 정보를 삭제합니다.
      parameters:
      - description: 관계자 ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 관계자 삭제 성공
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "400":
          description: 잘못된 ID 형식
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 관계자 삭제
      tags:
      - Stakeholder
    get:
      description: ID에 해당하는 특정 관계자의 상세 정보를 조회합니다.
      parameters:
      - description: 관계자 ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 관계자 상세 조회 성공
          schema:
            $ref: '#/definitions/domain.Stakeholder'
        "400":
          description: 잘못된 ID 형식
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: 관계자를 찾을 수 없음
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 관계자 상세 조회
      tags:
      - Stakeholder
    put:
      consumes:
      - application/json
      description: 특정 관계자의 연락처, 이름, 관계 등의 정보를 수정합니다.
      parameters:
      - description: 관계자 ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: 수정할 관계자 정보
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.Stakeholder'
      produces:
      - application/json
      responses:
        "200":
          description: 관계자 수정 성공
          schema:
