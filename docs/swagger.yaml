        type: string
    type: object
  domain.LastWord:
    properties:
      id:
        type: string
      message:
        type: string
      receiver:
        items:
          $ref: '#/definitions/domain.Stakeholder'
        type: array
      receiver_groups:
        items:
          $ref: '#/definitions/domain.StakeholderGroup'
        type: array
      title:
