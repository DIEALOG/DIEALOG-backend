    x-enum-varnames:
    - AccountTypeGoogle
    - AccountTypeFacebook
    - AccountTypeTwitter
    - AccountTypeApple
    - AccountTypeDiscord
    - AccountTypeMicrosoft
    - AccountTypeKakaoTalk
    - AccountTypeGitHub
    - AccountTypeTelegram
    - AccountTypeInstagram
    - AccountTypeOther
